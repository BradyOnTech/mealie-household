<html><head><meta property="og:description" content="Creamy Curry Ramen
Ingredients
For the Miso Curry Broth:
2 tbsp oil
6 cloves garlic, minced
2 tsp ginger, minced
1 tbsp lemongrass
2 tbsp curry paste
1 tbsp miso paste
1 can coconut milk (400 mL)
2 cups chicken broth
2 tbsp CHIN-SU fish sauce
1 tbsp or more of CHIN-SU hot sauce (adjust to your preference)
1 tbsp sugar
4 kaffir lime leaves
2 portions instant ramen noodles
For the Beef Topping:
500 g beef mince
1 tbsp oil for cooking
3 cloves garlic, minced
1/2 shallot, minced
2 tsp ginger, minced
2 tsp soy sauce
1 tsp dark soy sauce
1 tbsp CHIN-SU fish sauce
1 tsp sugar
Toppings:
Soft-boiled egg
Sliced green onions
Sesame seeds
CHIN-SU Hot sauce
Instructions
Prepare the broth, cook the beef, then cook the noodles and assemble."></head><body></body></html>
